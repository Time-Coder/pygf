[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygf"
version = "0.1.4"
description = "Graphics math types for Python: vectors, matrices and quaternions on ctypes"
readme = "README.md"
# The deprecated `{text = "MIT"}` table form rather than the PEP 639 SPDX string
# `license = "MIT"`: the newest setuptools that supports Python 3.7 is 68.0.0,
# which does not understand PEP 639 and rejects the bare string as an invalid
# definition. The `<license = "MIT">` string only installs on Python 3.9+.
license = { text = "MIT" }
requires-python = ">=3.7"
authors = [
    {name = "王炳辉", email = "binghui.wang@foxmail.com"}
]
keywords = [
    "graphics",
    "math",
    "linear-algebra",
    "vector",
    "matrix",
    "quaternion",
    "ctypes",
    "gltf",
    "usd"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # No `License ::` classifier: PEP 639 supersedes it with the `license`
    # expression above, and setuptools rejects the two together.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    # typing_extensions backports typing.TypeAlias to Python 3.7/3.8 (3.10 introduced it).
    "typing_extensions>=4.4.0",
    # numpy still ships 3.7/3.8 wheels; >=1.21 is the last line that supports 3.7.
    "numpy>=1.21",
]

# `dev` is what static_check.py needs. `publish` is what `python publish.py
# build` needs -- twine and build are not needed to work on the package.
[project.optional-dependencies]
dev = [
    "ruff",
    "ty"
]
publish = [
    "build",
    "twine"
]

[project.urls]
Homepage = "https://github.com/Time-Coder/pygf"
Source = "https://github.com/Time-Coder/pygf"

[tool.setuptools.packages.find]
where = ["."]
include = ["pygf*"]

[tool.setuptools.package-data]
pygf = ["py.typed"]