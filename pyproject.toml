[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygf"
version = "0.1.0"
description = "Graphics math types for Python: vectors, matrices and quaternions on ctypes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ty"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pygf*"]

[tool.setuptools.package-data]
pygf = ["py.typed"]